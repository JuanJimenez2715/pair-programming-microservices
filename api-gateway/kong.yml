_format_version: "3.0"

services:
  - name: ms-auth
    url: http://ms-auth:3000
    routes:
      - name: auth-route
        paths:
          - /api/auth

  - name: ms-pairing
    url: http://ms-pairing:3000
    routes:
      - name: pairing-route
        paths:
          - /api/sessions
        
  - name: ms-analytics
    url: http://ms-analytics:4000
    routes:
      - name: analytics-route
        paths:
          - /api/analytics

plugins:
          - name: proxy-cache
            config:
              strategy: memory
              cache_ttl: 10
              content_type:
                - "application/json"
              request_method:
                - GET

  - name: ms-editor
    url: http://ms-editor:3000
    routes:
      - name: editor-route
        paths:
          - /api/editor
        plugins:
          - name: rate-limiting
            config:
              minute: 30  # Stricter limit for AI Syncs/Editor calls
              policy: local

  - name: ms-ai
    url: http://ms-ai:8080
    routes:
      - name: ai-route
        paths:
          - /api/ai

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Trace-ID
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 200
      policy: local

  - name: correlation-id
    config:
      header_name: X-Trace-ID
      generator: uuid
      echo_downstream: true
